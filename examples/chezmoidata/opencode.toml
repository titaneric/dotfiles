[opencode]
# Chezmoi input retains the existing TOML keys; the template emits native V2 JSON.
isCompanyComputer = true
enabledProviders = ["openai", "ai-gateway"]
# Additional instructions are loaded only on company machines. Omit or use [] to disable.
instructions = ["~/.config/opencode/COMPANY-AGENTS.md"]

# Direct OpenAI: connect through /connect with ChatGPT or an OpenAI API key.
# Do not override its endpoint or credentials with gateway settings.
[[opencode.providers]]
id = "openai"
name = "OpenAI"

# Independent OpenAI-compatible gateway using /v1/responses.
[[opencode.providers]]
id = "ai-gateway"
name = "AI Gateway (Responses API)"
package = "@opencode/ai/providers/openai-compatible/responses"
# Use package directly; npm would override it in the chezmoi template.

[opencode.providers.options]
baseURL = "https://llm-gateway.example.internal/openai/v1"
apiKey = "{env:COMPANY_LLM_TOKEN}"

# Custom providers need explicit models to appear in /models.
# Select ai-gateway/gpt-6.1-sol; the request sends model = "gpt-6.1-sol".
# Replace modelID with the exact ID supported by your gateway.
[[opencode.providers.models]]
id = "gpt-6.1-sol"
modelID = "gpt-6.1-sol"
name = "GPT-6.1 Sol (Gateway)"

[opencode.mcp]
enabled = true

[[opencode.mcp.servers]]
name = "internal-docs"
type = "local"
command = [
  "npx",
  "@example/internal-mcp-connector@latest",
  "https://mcp.example.internal/docs",
]
enabled = false
# Rendered as mcp.servers.internal-docs.disabled = true.

[opencode.mcp.servers.environment]
NPM_CONFIG_REGISTRY = "https://npm.example.internal"
